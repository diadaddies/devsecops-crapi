name: deploy-and-dast
# Manually triggered DAST pipeline (Actions tab -> Run workflow).

# Runs on a SELF-HOSTED runner on your Kali box, because a cloud runner
# cannot reach crAPI on your localhost. This is the CD + DAST half:
# deploy the target, scan it while it runs, keep it up so you can attack by hand.
on:
  workflow_dispatch:
    inputs:
      teardown:
        description: 'Tear crAPI down after the scan (frees RAM). Leave false to attack it manually.'
        type: boolean
        default: false

jobs:
  deploy-and-dast:
    runs-on: [self-hosted, kali]
    steps:
      - uses: actions/checkout@v4

      - name: Deploy crAPI
        run: |
          docker compose -f target/docker-compose.yml --profile lean pull
          docker compose -f target/docker-compose.yml --profile lean up -d

      - name: Wait for crAPI to be healthy (:8888)
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8888/ || true)
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              echo "crAPI is up (HTTP $code)"; exit 0
            fi
            echo "waiting... ($i) got '$code'"; sleep 5
          done
          echo "crAPI did not come up in time"; docker compose -f target/docker-compose.yml ps; exit 1

      - name: DAST — nuclei
        run: |
          mkdir -p reports
          # Custom crAPI-focused templates + nuclei's built-in exposure/misconfig checks.
          # Two -t sources so the built-in store isn't overridden by the custom dir.
          nuclei -u http://127.0.0.1:8888 \
                 -t security/nuclei-templates/ \
                 -t "$HOME/.local/nuclei-templates" \
                 -tags exposure,misconfig,default-login \
                 -severity low,medium,high,critical \
                 -o reports/nuclei-report.txt -stats || true
          echo "----- findings -----"; cat reports/nuclei-report.txt || echo "(none)"

      - name: DAST — OWASP ZAP baseline
        run: |
          mkdir -p reports
          # --network host lets the ZAP container reach crAPI on the host's localhost.
          # -I = informational: warnings don't fail the job (report-only gate).
          docker run --rm --network host \
            -v "$PWD/reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:8888 \
              -r zap-baseline.html -w zap-baseline.md -x zap-baseline.xml \
              -I || true
          echo "----- ZAP summary -----"; cat reports/zap-baseline.md 2>/dev/null | head -40 || echo "(no ZAP report)"

      - name: Upload DAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-reports
          path: reports/

      - name: Teardown (optional)
        if: ${{ inputs.teardown }}
        run: docker compose -f target/docker-compose.yml down
