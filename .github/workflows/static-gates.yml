name: static-gates

# Runs on GitHub-hosted (cloud) runners — zero RAM cost on your Kali box.
# These are the "shift-left" gates: catch problems before anything deploys.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # lets SARIF results show in the repo Security tab

jobs:
  # ---------------------------------------------------------------------------
  # 1. Secret scanning — did anyone commit a credential, token, or key?
  # ---------------------------------------------------------------------------
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan repo for secrets (report-only)
        run: |
          # Whole-tree scan (--no-git), report-only (--exit-code 0). crAPI ships
          # demo creds on purpose, so expect hits — treat them as a teaching finding.
          gitleaks detect --source . --no-git --redact -v \
            --exit-code 0 --report-format sarif --report-path gitleaks.sarif
      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif

  # ---------------------------------------------------------------------------
  # 2. Config / IaC scan — misconfigurations in the compose file itself
  #    (privileged containers, exposed ports, missing limits, etc.)
  # ---------------------------------------------------------------------------
  config-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: target/
          severity: HIGH,CRITICAL
          exit-code: '0'            # report-only for now; flip to '1' to gate hard

  # ---------------------------------------------------------------------------
  # 3. Image CVE scan — the crAPI stack pins postgres:14, mongo:4.4, etc.
  #    Great real-world lesson: how many known CVEs ship in "normal" images.
  # ---------------------------------------------------------------------------
  image-cve-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - postgres:14
          - mongo:4.4
          - chromadb/chroma:latest
    steps:
      - name: Trivy scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'            # report-only; these WILL find CVEs — study them

  # ---------------------------------------------------------------------------
  # 4. SAST — source-level analysis. crAPI is a third-party app, so this
  #    targets ./services, where YOUR own code goes. Empty today, wired for later.
  # ---------------------------------------------------------------------------
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install semgrep
        run: python -m pip install --quiet semgrep
      - name: Run semgrep on ./services
        run: |
          if [ -z "$(find services -type f ! -name '.keep-empty' 2>/dev/null)" ]; then
            echo "No custom code in ./services yet — skipping. Add your own service to exercise SAST."
            exit 0
          fi
          semgrep scan --config auto --error services/
